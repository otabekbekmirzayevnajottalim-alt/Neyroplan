
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeyrPlan - AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
    
    :root {
      --gemini-bg: #0e0e11;
      --gemini-surface: #1e1f20;
      --gemini-hover: #2b2c2f;
      --gemini-text: #e3e3e3;
      --gemini-subtext: #8e918f;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--gemini-bg);
      color: var(--gemini-text);
      overflow: hidden;
    }

    .brand-font {
      font-family: 'Inter', sans-serif;
      letter-spacing: -0.02em;
    }

    .sparkle-gradient {
      background: linear-gradient(135deg, #4285f4 0%, #9b72cb 50%, #d96570 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glass-pill {
      background-color: var(--gemini-surface);
      border: 1px solid #3c4043;
      transition: all 0.2s ease;
    }

    .glass-pill:focus-within {
      background-color: #28292a;
      border-color: #5f6368;
      box-shadow: 0 1px 2px 0 rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
    }

    .nav-item-active {
      background-color: #37393b;
      color: white;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #3c4043;
      border-radius: 10px;
    }
    
    @keyframes rotate-sparkle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-sparkle {
      animation: rotate-sparkle 20s linear infinite;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
      "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
      "react/": "https://esm.sh/react@^19.2.4/",
      "react": "https://esm.sh/react@^19.2.4"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
